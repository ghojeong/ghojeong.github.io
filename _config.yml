  - title: Bithumb 프로젝트 상세
    layout: list
    content:
      - title: SBS 가요대전 방청권 신청
        sub_title: 1.7만 RPS 처리 가능한 시스템 구축
        caption: KCB, Java, Spring, Aurora, Redis <br><br> <img src="images/bit/rps.png" width="350px" /> <br> <img src="images/bit/response_time.png" width="350px" />
        description: |
          **프로젝트 개요**<br>
          10분 동안 50만 신청이 예상되는 SBS 방청권 신청 시스템 개발

          **팀 구성 및 역할**<br>
          - 단독으로 BE 로직 개발, 테이블 및 아키텍처 설계 담당
          - DevOps 팀에서 인프라 검수 / 데이터 팀에서 모델 검수

          **주요 업무**
          - KCB 휴대폰 인증을 활용한 비회원 방청권 신청 로직 구현

          **문제 해결 과정**
          - **트래픽 제어 전략**
             - Net Funnel을 통한 단일 진입 포인트 유량 제어
             - Service Gateway에 Request Rate Limit 설정 (1.7만 RPS)
          - **비동기 처리 아키텍처**
             - Kafka 이벤트 발행을 통한 Back Pressure 구현
             - 이벤트 발행은 1.8만 RPS로 처리, DB 쓰기는 1,288 TPS로 관리
             - KCB 인증 결과 저장과 알림톡 발송에 대한 Consumer 를 분리
             - 알림톡 과부하 방지를 위한 발송 킬 스위치 구현
          - **데이터 처리**
             - Redis 임시 캐싱 후 Write Back 방식으로 DB 부하 감소
             - 중복 검사와 같은 모든 조회 로직은 Redis 캐시 활용

          **기여 성과**
          - <mark>1.7만 RPS</mark>를 처리 가능한 시스템 구축
          - 생애최초 신규회원 2만명 모객

  - title: SumOne 프로젝트 상세
    layout: list
    content:
      - title: 1900만명 회원 데이터
        sub_title: 서비스 무중단 마이그레이션
        caption: PostgreSQL, DynamoDB, AWS DMS <br><br> <img src="images/sumone/migration.png" width="350px" />
        description: |
          **프로젝트 개요**<br>
          커플 다이어리 서비스의 전체 회원 데이터를 PostgreSQL에서 DynamoDB로 마이그레이션

          **팀 구성 및 역할**<br>
          - 단독으로 마이그레이션 구현 및 설계 담당

          **주요 업무**
          - 회원 1900만명의 데이터 마이그레이션 전략 수립 및 실행
          - Prisma 인터페이스에 호환되도록 DynamoDB 쿼리빌더와 DAO 구현
          - 커플 단위 Spatial Locality 를 위해 Partition Key, Sort Key 설계

          **문제 해결 과정**
          - 1단계: 양쪽 DB 동시 쓰기 (PostgreSQL 읽기, 롤백 대비)
          - 2단계: AWS DMS 기반 Heterogeneous 마이그레이션
             - DynamoDB Put 의 attribute_not_exists 옵션 활용
             - 1단계의 최신 데이터가 오래된 데이터로 덮어씌워지 않도록 방지
          - 3단계: DynamoDB 읽기 전환 (2주간 모니터링 후 PostgreSQL 쓰기 중단)
          - 4단계: PostgreSQL 의 데이터 정리

          **기여 성과**
          - **서비스 무중단** 마이그레이션
          - 롤백 가능한 **점진적** 마이그레이션 전략으로 리스크 최소화
          - 커플 단위 데이터 파티셔닝으로 쿼리 성능 향상

  - title: Dreamfora 프로젝트 상세
    layout: list
    content:
      - title: 인증을 세션 기반에서 JWT 기반으로 변경
        sub_title: 인증시간 8초에서 0.1초로 단축
        caption: Java, Spring Security, JWT
        description: |
          **프로젝트 개요**<br>
          세션 기반 인증 구조를 JWT 기반 sessionless 형태로 전환하여 인증 성능 개선

          **팀 구성 및 역할**<br>
          - 4명의 팀으로 개선된 인증 방식을 구현 (백엔드 2명, 모바일 2명)
          - 단독으로 문제 분석 후, 팀 전체에게 인증 아키텍처 개선을 설득

          **주요 업무**
          - Spring Security를 활용한 JWT 기반 인증 시스템 설계 및 구현
          - AccessToken (1주일 갱신) / RefreshToken (6개월 유효) 분리 구조 설계

          **문제 해결 과정**
          - **세션 성능 문제 분석**
             - 세션이 Storage에 저장되어 I/O 병목 발생
             - 8천만 개의 세션이 TTL 없이 누적
             - 인덱스 미설정으로 풀스캔 발생
          - **JWT 아키텍처 설계**
             - Stateless 아키텍처로 서버 부하 감소
             - Token 갱신 전략으로 보안과 UX 균형

          **기여 성과**
          - 인증시간 8초에서 0.1초로 단축
          - 서버 확장성 향상 (세션 공유 불필요)
          - 보안 강화 (토큰 기반 인증)

      - title: AWS 로 인프라 전환
        sub_title: 장애 빈도 99% 감소
        caption: EC2, ECS, RDS, S3, ALB, VPC, CloudFront, Route53, IAM <br><br> <img src="images/dreamfora/dreamfora_crash.png" width="350px" />
        description: |
          **프로젝트 개요**<br>
          IDC 호스팅에서 AWS 클라우드로 인프라 전환

          **팀 구성 및 역할**<br>
          - 단독으로 메가존 클라우드의 컨설팅을 받으며 수행
          - 인프라 전환 후 백엔드 팀에게 클라우드 교육 담당

          **주요 업무**
          - AWS 인프라 아키텍처 설계 (VPC, EC2, RDS, ALB, S3, CloudFront)
          - 보안 강화 (VPC 망분리, Bastion Host)
          - 무중단 배포 파이프라인 구축 (ECS, CodePipeline)
          - dev/stage/production 환경 분리

          **문제 해결 과정**
          - **클라우드 아키텍처**
             - Load Balancer를 통한 WAS 이중화
             - RDS 백업 설정으로 데이터 안정성 확보
             - VPC 사설망으로 DB 보안 강화
          - **무중단 배포**
             - dev/stage: NGINX 포트 포워딩 Blue-Green 배포
             - production: ECS Rolling 배포 (빠른 롤백 대응)
          - **DNS 전환 리스크 관리**
             - Name Server 48시간 TTL 대비 Redirect 프록시 구축

          **기여 성과**
          - WAS 이중화 후 **장애 빈도 99% 감소**
          - AWS 스타트업 Credit 지원 확보
          - 배포 자동화로 개발 생산성 향상

      - title: 스키마 재설계, 쿼리 튜닝
        sub_title: 서버 비용 82% 절감
        caption: Java, Spring, JPA, MariaDB <br><br> <img src="images/dreamfora/megazone.png" width="350px" />
        description: |
          **프로젝트 개요**<br>
          재귀 쿼리와 N+1 문제를 해결하기 위한 DB 스키마 재설계 및 성능 최적화

          **팀 구성 및 역할**<br>
          - 2명의 백엔드 팀으로 진행
          - 스키마 재설계와, 데이터 마이그레이션 담당
          - 사내 스터디와 코드리뷰를 통해 리팩토링을 위한 컨벤션 정의

          **주요 업무**
          - 재귀 쿼리를 JOIN 쿼리로 변경 가능한 스키마 재설계
          - SQL Stored Procedure를 테스트 가능한 Java 로직으로 전환
          - 쿼리 플랜 분석 및 인덱스 최적화

          **문제 해결 과정**
          - **스키마 재설계**
             - 재귀 쿼리의 정지 조건 오류로 인한 서버 성능 저하 문제 분석
             - JOIN으로 해결 가능한 테이블 구조로 재설계
          - **코드 리팩토링**
             - Stored Procedure → Java 객체 변환
             - 단위 테스트로 로직 검증
             - 쿼리 플랜 분석 후 필요 인덱스 추가
          - **데이터 마이그레이션**
             - Spring Batch 활용
             - JPA BatchStatement 최적화
             - Persistable 인터페이스 override 로 N+1 SELECT 제거

          **기여 성과**
          - 서버 비용 월 **1,518달러에서 270달러로 82% 절감**
          - 일일 서버 리소스 비용 **51.2달러에서 7.3달러로 감소**

  - title: EcubeLabs 프로젝트 상세
    layout: list
    content:
      - title: 파트너사를 위한 OAuth2
        sub_title: 인증 서버와 리소스 서버 구축
        caption: Express.js, MySQL, JWT, apiDoc
        description: |
          **프로젝트 개요**<br>
          한국 고양시 쓰레기 매립지의 계근 작업 자동화를 위한 RESTful API 개발.<br>
          파트너 하드웨어 업체가 계근 데이터를 서버와 동기화하도록 OAuth2 인증 서버와 리소스 서버 구현

          **팀 구성 및 역할**<br>
          - 3명의 팀으로 진행 (백엔드 2명, DevOps 1명)
          - 인증 및 리소스 API 구현 및 문서화 담당

          **주요 업무**
          - JWT 기반 OAuth2 인증/인가 시스템 설계 및 구현
          - 계근 데이터 CRUD API 개발 및 문서화
          - 파트너 하드웨어 업체와의 API 연동 지원 및 외부 교육

          **문제 해결 과정**
          - **토큰 권한 관리**
             - 권한별 API 접근 제어를 비트마스크로 구현
          - **API 사용량 모니터링**
             - API 호출 로그를 수집하여 사용량 대시보드 제공
             - API 사용량에 따른 과금 데이터 제공

          **기여 성과**
          - 오프라인 USB 전달 방식에서 온라인 실시간 데이터 전송으로 전환
          - 정부 시청과의 데이터 공유 주기를 수개월에서 실시간으로 단축
          - API 문서화로 외부 업체 연동 비용 감소

      - title: QR 기반 인증 및 과금
        sub_title: 이치카와시 공공 쓰레기통 유료화
        caption: React, TypeScript, Redux, GraphQL <br><br> <img src="images/ecubelabs/i-Box.png" width="350px" />
        description: |
          **프로젝트 개요**<br>
          일본 이치카와시에 설치된 스마트 공공 쓰레기통 시스템 개발. <br>
          쓰레기 배출자를 QR 코드로 인증하고, 배출량에 따라 과금

          **팀 구성 및 역할**<br>
          - 4명의 팀으로 진행 (웹 개발자 2명, IoT 엔지니어 2명)
          - QR 기반 인증의 웹 로직 담당

          **주요 업무**
          - 웹/앱을 통한 QR 이미지 생성 기능 개발
          - 이치카와시 공무원용 관리자 모니터링 대시보드 개발
          - GraphQL API 호출 최적화를 위한 커스텀 훅 설계

          **문제 해결 과정**
          - **비동기 처리 최적화**
             - GraphQL API 호출을 모두 커스텀 훅으로 비동기 처리
             - React Hooks를 활용한 상태 관리로 렌더링 최적화
             - redux-observable과 RxJS를 활용한 복잡한 비동기 플로우 관리
          - **다국어 지원**
             - react-intl을 활용한 일본어 지원

          **기여 성과**
          - 이치카와시의 쓰레기 배출 추적을 통한 공공 쓰레기통 유료화 시스템 구축

      - title: E2E 테스트 환경 구축
        sub_title: 웹/모바일 E2E 테스트 환경 구축
        caption: Selenium, Appium, TypeScript, Jest <br><br> <img src="images/ecubelabs/appium-login.gif" width="350px" /> <br><br> <img src="images/ecubelabs/selenium-login.gif" width="350px" />
        description: |
          **프로젝트 개요**
          - 웹 및 모바일 앱(React Native)에 대한 E2E 테스트 자동화 환경 구축
          - Selenium과 Appium을 활용하여 사용자 시나리오 기반 테스트 작성

          **팀 구성 및 역할**<br>
          - 단독으로 개선 방안 제안 후 사례 공유

          **주요 업무**
          - Selenium을 활용한 웹 E2E 테스트 환경 구축
          - Appium을 활용한 React Native 모바일 앱 E2E 테스트 환경 구축
          - 사용자 인증 플로우 테스트 자동화
          - 테스트 코드 작성 가이드 문서화

          **문제 해결 과정**
          - **React Native 컴포넌트 접근성 문제**
             - Animated.View로 감싸진 컴포넌트는 XPath를 사용해야 이벤트 전달 가능
             - accessibilityId 접근 방식이 iOS 환경에서 불안정한 문제 발견
             - XPath 기반 요소 선택으로 크로스 플랫폼 안정성 확보
          - **테스트 안정성 향상**
             - 비동기 렌더링으로 인한 타이밍 이슈 해결 (명시적 대기 조건 추가)
             - 테스트 환경 격리를 위한 데이터 초기화 스크립트 작성
          - **팀 문화 정착 시도**
             - E2E 테스트 작성 가이드 문서화 및 팀 공유
             - 테스트 자동화의 이점을 개발팀과 QA팀에 전파

          **기여 성과**
          - 웹/모바일 E2E 테스트 인프라 구축
          - 인증 플로우 자동화 테스트로 회귀 버그 조기 발견 가능

