about_content: | # this will include new lines to allow paragraphs
  맡은 제품에 강한 책임감을 가지고 파고드는 개발자 고정완입니다. <br>
  4년간 드림포라의 테크리드로 서비스를 바닥부터 만들며 200만 사용자, MAU 16만을 달성했습니다. <br>
  4년간 ATDD Cycle을 실천했습니다. 커버리지 보다는 <strong>요구사항을 정확히 검증하는 테스트</strong>를 추구합니다. <br>

  5년간 끊임없이 개발 스터디를 했으며, 동작원리를 깊게 파고드는 공부를 좋아합니다. <br>
  스터디 활동을 인정받아 NEXTSTEP과 우아한테크코스에서 전문 리뷰어 활동을 했습니다. <br>
  바닐라 언어만으로 <strong>프레임워크를 바닥부터 만드는</strong> 스터디에 자주 참여합니다.

  UNIST 에서 컴퓨터공학과 수리과학을 융합전공하여 성적우수 졸업했습니다. <br>
  문제를 풀기 전에, 문제 요구사항을 수학적으로 정의하는 훈련을 받았습니다.

