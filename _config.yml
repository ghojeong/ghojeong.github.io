  - title: 포트폴리오 (Spring Security 바닥부터 구현)
    layout: list
    content:
      - title: OAuth2 인증(Authentication)
        sub_title: OAuth2LoginAuthenticationFilter
        caption: OAuth2 인증 제공자의 응답을 처리한 후, 사용자 인증을 완료
        description: |
          - [PR 링크](https://github.com/next-step/spring-security-oauth2/pull/8)
          - Google/Github 인증을 구현
          - 인증된 사용자를 Member 어플리케이션 객체로 관리하는 기능을 구현
          - OAuth2AuthorizationRequestRedirectFilter 로 OAuth2 인증 요청을 리다이렉트
          - ClientRegistrationRepository 로 OAuth2 제공자(Google/Github)에 대한 클라이언트 등록 정보를 관리
          - OAuth2UserService 로 Member 어플리케이션 객체를 생성하거나 업데이트
          - attemptAuthentication 메서드 구현

      - title: 인가(Authorization)
        sub_title: AuthorizationManager
        caption: 인가 과정을 AuthorizationManager 로 추상화
        description: |
          - [PR 링크](https://github.com/next-step/spring-security-authorization/pull/9)
          - 4가지 AuthorizationManager 구현
          - 모든 요청 허용 (PermitAllAuthorizationManager)
          - 모든 요청 거부 (DenyAllAuthorizationManager)
          - 인증된 사용자에게만 인가 (AuthenticatedAuthorizationManager)
          - ADMIN 사용자에게만 인가 (AuthorityAuthorizationManager)
          - [RoleHierarchy 구현](https://github.com/next-step/spring-security-authorization/pull/31)


  - title: Bithumb 프로젝트 상세
    layout: list
    content:
      - title: SBS 가요대전 방청권 신청
        sub_title: 1.7만 RPS 처리 가능한 시스템 구축
        caption: KCB, Java, Spring, Aurora, Redis
        description: |
          **프로젝트 개요**<br>
          SBS 가요대전을 통한 빗썸 마케팅 이벤트로, <br>
          10분간 50만 신청이 예상되는 방청권 신청 시스템 개발

          **주요 업무**
          - KCB 휴대폰 인증을 활용한 비회원 방청권 신청 로직 구현
          - 거래소 서비스에 영향을 주지 않는 고가용성 아키텍처 설계 및 구현
          - 10분 간 50만명의 신청을 버티는 대규모 트래픽 처리를 위한 성능 최적화

          **문제 해결 과정**
          - **트래픽 분산 전략**
             - Service Gateway에 Request Rate Limit 설정 (1.7만 RPS)
             - Net Funnel을 통한 단일 진입 포인트 유량 제어
          - **비동기 처리 아키텍처**
             - Kafka 이벤트 발행을 통한 Back Pressure 구현
             - 이벤트 발행 1.8만 RPS 처리, DB 쓰기는 1,288 TPS로 관리
             - KCB 인증 결과 조회와 알림톡 발송을 이벤트 Consumer로 분리
          - **데이터 처리 최적화**
             - Redis 임시 캐싱 후 Write Back 방식으로 DB 부하 감소
             - 알림톡 과부하 방지를 위한 발송 킬스위치 구현

          **기여 성과**
          - **1.7만 RPS** 처리 가능한 시스템 구축
          - 거래소 서비스에 영향 없이 안정적인 이벤트 진행
          - Kafka를 활용한 비동기 처리로 시스템 안정성 확보

      - title: 회원 정합성 검증 배치
        sub_title: 일일 배치 소요 시간 90% 개선
        caption: Java, Spring Batch, Oracle
        description: |
          **프로젝트 개요**<br>
          FIU, 금감원 자료 추출 시 회원/고객 데이터 정합성 문제를 <br>
          사전에 방지하기 위한 일일 배치 시스템 개발

          **주요 업무**
          - 회원 데이터의 정합성 검증 배치 설계 및 개발
          - 정합성 검증 항목
            - 회원 이메일 중복
            - 고객 실명번호 중복
            - 고객의 회원계정 부재
            - 주계정 중복
            - 고객 CI 중복
          - 정합성 검증 전략의 확장을 위해 책임 연쇄 디자인 패턴을 도입
          - 정합성 문제 시 Slack 알림으로 연동

          **문제 해결 과정**
          - **성능 최적화**
             - JDBC READ_ONLY 옵션으로 row/table 락 방지
             - TYPE_FORWARD_ONLY 옵션으로 트랜잭션 영향 제거
             - 페이지 기반이 아닌 커서 기반 처리로 메모리 효율화
          - **실서비스 영향 최소화**
             - 읽기 전용 트랜잭션으로 서비스 락 방지
             - 대규모 데이터 처리 시에도 DB 성능 낭비 방지

          **기여 성과**
          - 일일 배치 소요 시간 **30분에서 3분 내외로 단축** (90% 개선)
          - 규제 리스크 사전 관리 체계 구축
          - 확장 가능한 체인 구조로 향후 정합성 검증 로직 추가 용이

      - title: 모든기기 로그아웃
        sub_title: FIU 감사 대비 필수 기능 사전 구축
        caption: Java, Spring, Oracle, Redis
        description: |
          **프로젝트 개요**<br>
          금융감독원의 계정 보안 강화 요구사항에 따른 <br>
          '모든기기 로그아웃' 기능 개발 및 이력 관리<br>

          **주요 업무**
          - 대고객용 모든 기기 로그아웃 API 구현
          - 로그아웃 이력을 통합 로깅 체계에 추가

          **문제 해결 과정**
          - 비밀번호 변경 시 자동 로그아웃 트리거 구현
          - 로그아웃 후 캐시 자동 삭제 로직 구현

          **기여 성과**
          - FIU 감사 대비 필수 기능 사전 구축
          - 통합 로깅 체계로 감사 대응 편의성 향상

  - title: SumOne 프로젝트 상세
    layout: list
    content:
      - title: 1900만명 회원 데이터 Hashed Sharding
        sub_title: 서비스 무중단 마이그레이션
        caption: PostgreSQL, DynamoDB, AWS DMS
        description: |
          **프로젝트 개요**<br>
          DAU 120만 커플 다이어리 서비스의 핵심 회원 데이터를 <br> 
          PostgreSQL에서 DynamoDB로 무중단 마이그레이션

          **주요 업무**
          - 회원 1900만명의 데이터 마이그레이션 전략 수립 및 실행
          - DynamoDB 특성에 맞는 스키마 재설계 (Partition Key, Sort Key)
          - 커플 단위 Spatial Locality 확보를 위한 키 설계

          **문제 해결 과정**
          - **점진적 마이그레이션**
             - 1단계: 양쪽 DB 동시 쓰기 (PostgreSQL 읽기, 롤백 대비)
             - 2단계: AWS DMS 기반 Heterogeneous 마이그레이션
             - 3단계: DynamoDB 읽기 전환 (2주간 모니터링 후 PostgreSQL 쓰기 중단)
             - 4단계: PostgreSQL 의 데이터 정리

          **기여 성과**
          - **서비스 무중단** 마이그레이션
          - 롤백 가능한 **점진적** 마이그레이션 전략으로 리스크 최소화
          - 커플 단위 데이터 파티셔닝으로 쿼리 성능 향상

  - title: Dreamfora 프로젝트 상세
    layout: list
    content:
      - title: 인증을 세션 기반에서 JWT 기반으로 변경
        sub_title: 인증 속도 93% 개선
        caption: Java, Spring Security, JWT
        description: |
          **프로젝트 개요**<br>
          세션 기반 인증 구조를 JWT 기반 sessionless 형태로 전환하여 인증 성능 개선<br>

          **주요 업무**
          - Spring Security를 활용한 JWT 기반 인증 시스템 설계 및 구현
          - AccessToken (1주일 갱신) / RefreshToken (6개월 유효) 분리 구조 설계<br>

          **문제 해결 과정**
          - **세션 성능 문제 분석**
             - 세션이 Storage에 저장되어 I/O 병목 발생
             - 8천만 개의 세션이 TTL 없이 누적
             - 인덱스 미설정으로 풀스캔 발생
          - **JWT 아키텍처 설계**
             - Stateless 아키텍처로 서버 부하 감소
             - Token 갱신 전략으로 보안과 UX 균형

          **기여 성과**
          - 인증 시간 **8초에서 0.5초 이내로 단축** (93% 개선)
          - 서버 확장성 향상 (세션 공유 불필요)
          - 보안 강화 (토큰 기반 인증)

      - title: AWS 로 인프라 전환
        sub_title: 장애 빈도 99% 감소
        caption: EC2, ECS, RDS, S3, ALB, VPC, CloudFront, Route53, IAM <br><br> <img src="images/dreamfora/dreamfora_crash.png" width="350px" />
        description: |
          **프로젝트 개요**<br>
          IDC 호스팅에서 AWS 클라우드로 인프라 전환 및 고가용성 아키텍처 구축

          **주요 업무**
          - AWS 인프라 아키텍처 설계 (VPC, EC2, RDS, ALB, S3, CloudFront)
          - 보안 강화 (VPC 망분리, Bastion Host)
          - 무중단 배포 파이프라인 구축 (ECS, CodePipeline)
          - dev/stage/production 환경 분리

          **문제 해결 과정**
          - **고가용성 아키텍처**
             - Load Balancer를 통한 WAS 이중화
             - RDS 백업 설정으로 데이터 안정성 확보
             - VPC 사설망으로 DB 보안 강화
          - **무중단 배포**
             - dev/stage: NGINX 포트 포워딩 Blue-Green 배포
             - production: ECS Rolling 배포 (빠른 롤백 대응)
          - **DNS 전환 리스크 관리**
             - Name Server 48시간 TTL 대비 Redirect 프록시 구축

          **기여 성과**
          - WAS 이중화 후 **장애 빈도 99% 감소**
          - AWS 스타트업 Credit 지원 확보
          - 배포 자동화로 개발 생산성 향상

      - title: 스키마 재설계, 쿼리 튜닝
        sub_title: 서버 비용 82% 절감
        caption: Java, Spring, JPA, MariaDB <br><br> <img src="images/dreamfora/megazone.png" width="350px" />
        description: |
          **프로젝트 개요**<br>
          재귀 쿼리와 N+1 문제를 해결하기 위한 DB 스키마 재설계 및 성능 최적화

          **주요 업무**
          - 재귀 쿼리를 JOIN 쿼리로 변경 가능한 스키마 재설계
          - SQL Stored Procedure를 테스트 가능한 Java 로직으로 전환
          - 쿼리 플랜 분석 및 인덱스 최적화

          **문제 해결 과정**
          - **스키마 재설계**
             - 재귀 쿼리의 정지 조건 오류로 인한 서버 성능 저하 문제 분석
             - JOIN으로 해결 가능한 테이블 구조로 재설계
          - **코드 리팩토링**
             - Stored Procedure → Java 객체 변환
             - 단위 테스트로 로직 검증
             - 쿼리 플랜 분석 후 필요 인덱스 추가
          - **데이터 마이그레이션**
             - Spring Batch 활용
             - JPA BatchStatement 최적화
             - Persistable 인터페이스로 N+1 SELECT 제거

          **기여 성과**
          - 서버 비용 월 **1,518달러에서 270달러로 82% 절감**
          - 일일 서버 리소스 비용 **51.2달러에서 7.3달러로 감소**

  - title: EcubeLabs 프로젝트 상세
    layout: list
    content:
      - title: 파트너사를 위한 OAuth2.0
        sub_title: 인증 서버와 리소스 서버 구축
        caption: Express.js, MySQL, JWT, apiDoc
        description: |
          **프로젝트 개요**<br>
          한국 고양시 쓰레기 매립지의 계근 작업 자동화를 위한 RESTful API 개발. <br>
          파트너 하드웨어 업체가 계근 데이터를 서버와 동기화 가능하도록 <br>
          OAuth2.0 인증 서버와 리소스 서버 구현<br>

          **주요 업무**
          - JWT 기반 OAuth2.0 인증/인가 시스템 설계 및 구현
          - 계근 데이터 CRUD API 개발 및 문서화 (apiDoc)
          - 외부 하드웨어 업체와의 API 연동 지원
          - API 사용량 기반 과금 시스템 대시보드 개발

          **문제 해결 과정**
          - **토큰 권한 관리**
             - 권한별 API 접근 제어를 비트마스크로 구현
          - **API 사용량 모니터링**
             - API 호출 로그를 수집하여 사용량 대시보드 제공
             - 외부 업체별 API 사용량에 따른 과금 데이터 제공

          **기여 성과**
          - 오프라인 USB 전달 방식에서 온라인 실시간 데이터 전송으로 전환
          - 정부 시청과의 데이터 공유 주기를 수개월에서 실시간으로 단축
          - API 문서화로 외부 업체 연동 비용 감소

      - title: QR 기반 인증 및 과금
        sub_title: 이치카와시 공공 쓰레기통 유료화
        caption: React, TypeScript, Redux, GraphQL <br><br> <img src="images/ecubelabs/i-Box.png" width="350px" />
        description: |
          **프로젝트 개요**<br>
          일본 이치카와시에 설치된 스마트 공공 쓰레기통(i-Box) 시스템 개발. <br>
          쓰레기 배출자를 QR 코드로 인증하고, 배출량에 따라 과금

          **주요 업무**
          - 웹/앱을 통한 QR 이미지 생성 기능 개발
          - 이치카와시 공무원용 관리자 모니터링 대시보드 개발
          - GraphQL API 호출 최적화를 위한 커스텀 훅 설계

          **문제 해결 과정**
          - **비동기 처리 최적화**
             - GraphQL API 호출을 모두 커스텀 훅으로 비동기 처리
             - React Hooks를 활용한 상태 관리로 렌더링 최적화
             - redux-observable과 RxJS를 활용한 복잡한 비동기 플로우 관리
          - **다국어 지원**
             - react-intl을 활용한 일본어/영어 다국어 지원
             - 일본 공무원과의 원활한 커뮤니케이션을 위한 UI/UX 현지화

          **기여 성과**
          - 이치카와시의 쓰레기 배출 추적을 통한 공공 쓰레기통 유료화 시스템 구축

      - title: E2E 테스트 환경 구축
        sub_title: 웹/모바일 E2E 테스트 환경 구축
        caption: Selenium, Appium, TypeScript, Jest <br><br> <img src="images/ecubelabs/appium-login.gif" width="350px" /> <br><br> <img src="images/ecubelabs/selenium-login.gif" width="350px" />
        description: |
          **프로젝트 개요**
          - 웹 및 모바일 앱(React Native)에 대한 E2E 테스트 자동화 환경 구축
          - Selenium과 Appium을 활용하여 사용자 시나리오 기반 테스트 작성

          **주요 업무**
          - Selenium을 활용한 웹 E2E 테스트 환경 구축
          - Appium을 활용한 React Native 모바일 앱 E2E 테스트 환경 구축
          - 사용자 인증 플로우 테스트 자동화
          - 테스트 코드 작성 가이드 문서화

          **문제 해결 과정**
          - **React Native 컴포넌트 접근성 문제**
             - Animated.View로 감싸진 컴포넌트는 XPath를 사용해야 이벤트 전달 가능
             - accessibilityId 접근 방식이 iOS 환경에서 불안정한 문제 발견
             - XPath 기반 요소 선택으로 크로스 플랫폼 안정성 확보
          - **테스트 안정성 향상**
             - 비동기 렌더링으로 인한 타이밍 이슈 해결 (명시적 대기 조건 추가)
             - 테스트 실패 시 스크린샷 자동 캡처 기능 구현
             - 테스트 환경 격리를 위한 데이터 초기화 스크립트 작성
          - **팀 문화 정착 시도**
             - E2E 테스트 작성 가이드 문서화 및 팀 공유
             - 테스트 자동화의 이점을 개발팀과 QA팀에 전파

          **기여 성과**
          - 웹/모바일 E2E 테스트 인프라 구축
          - 인증 플로우 자동화 테스트로 회귀 버그 조기 발견 가능

